name: Build KintoUn

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: KintoUn
          path: build/libs/*.jar
